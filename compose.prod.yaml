name: ${COMPOSE_PROJECT_NAME:-phay}

networks:
  phay:

volumes:
  postgres_data:
  # Uploaded files (logos, photos, videos): written by backend, served by api.
  public_storage:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phay}
      POSTGRES_USER: ${POSTGRES_USER:-phay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phay} -d ${POSTGRES_DB:-phay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phay

  backend:
    build:
      context: ./api
      target: php
      additional_contexts:
        configs: ./docker
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Phay}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set — see README}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL must be set}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-phay}
      DB_USERNAME: ${POSTGRES_USER:-phay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      LEADS_RATE_LIMIT_PER_MINUTE: ${LEADS_RATE_LIMIT_PER_MINUTE:-5}
      ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      # Sign-in security: links in emails, mail, SMS codes (see README).
      ADMIN_URL: ${ADMIN_URL:?ADMIN_URL must be set (e.g. https://app.phay.am)}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@phay.am}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Phay}
      SMS_DRIVER: ${SMS_DRIVER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWO_FACTOR_REQUIRED_FOR_OWNERS: ${TWO_FACTOR_REQUIRED_FOR_OWNERS:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MONTHLY_LIMIT: ${ASSISTANT_MONTHLY_LIMIT:-30}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT:-low}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LOG_CHANNEL: stack
    volumes:
      - public_storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phay

  api:
    build:
      context: ./api
      target: nginx
      additional_contexts:
        configs: ./docker
    restart: unless-stopped
    volumes:
      - public_storage:/var/www/html/public/storage:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phay

  admin:
    build:
      context: ./admin
      target: runner
    restart: unless-stopped
    environment:
      NEXT_INTERNAL_API_URL: http://api/api/v1
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      - api
    networks:
      - phay
