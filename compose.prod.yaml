# Phay PRODUCTION stack (make prod-*). Every setting comes from .env.prod:
#   docker compose --env-file .env.prod -f compose.prod.yaml ...
# The Makefile passes both; .env (local) is never read here.
# Ports are published on 127.0.0.1 only: the host nginx (deploy/phay.nginx.conf)
# is the only way in from outside. Docker's own published ports bypass ufw,
# so 0.0.0.0 here would open them to the internet.
name: ${COMPOSE_PROJECT_NAME:-phay-prod}

networks:
  phay:

volumes:
  postgres_data:
  # Uploaded files (logos, photos, videos): written by backend, served by api.
  public_storage:
  # storage/logs: laravel.log survives container rebuilds.
  app_logs:

# Shared by backend (php-fpm) and scheduler: same image, same settings.
x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-phay-prod}-backend
  restart: unless-stopped
  env_file: .env.prod
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?APP_KEY must be set in .env.prod (make prod-key)}
    APP_URL: ${APP_URL:?APP_URL must be set in .env.prod (https://api.phay.am)}
    ADMIN_URL: ${ADMIN_URL:?ADMIN_URL must be set in .env.prod (https://app.phay.am)}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-phay}
    DB_USERNAME: ${POSTGRES_USER:-phay}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
  volumes:
    - public_storage:/var/www/html/storage/app/public
    - app_logs:/var/www/html/storage/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - phay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phay}
      POSTGRES_USER: ${POSTGRES_USER:-phay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phay} -d ${POSTGRES_DB:-phay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phay

  backend:
    <<: *backend
    build:
      context: ./api
      target: php
      additional_contexts:
        configs: ./docker

  # Laravel's scheduler (routes/console.php): daily subscription warnings
  # and pruning of expired admin sessions. Same image, no php-fpm.
  scheduler:
    <<: *backend
    # Built by the backend service (make prod-build).
    pull_policy: never
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  api:
    build:
      context: ./api
      target: nginx
      additional_contexts:
        configs: ./docker
    restart: unless-stopped
    volumes:
      - public_storage:/var/www/html/public/storage:ro
    ports:
      - "127.0.0.1:${API_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phay

  admin:
    build:
      context: ./admin
      target: runner
    restart: unless-stopped
    environment:
      NEXT_INTERNAL_API_URL: http://api/api/v1
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    depends_on:
      - api
    networks:
      - phay
