; Shared PHP runtime settings for the Phay API (dev and prod).
memory_limit = 256M
; Bumped from 10M/12M for the Auto Care admin's process-video uploads
; (Admin\UploadController validates video files up to 80M) — everything
; else on the site still uploads plain images, well under this ceiling.
upload_max_filesize = 80M
post_max_size = 90M
max_execution_time = 30
date.timezone = Asia/Yerevan
expose_php = Off
display_errors = Off
log_errors = On
