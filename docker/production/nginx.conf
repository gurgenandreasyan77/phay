server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Matches php.ini's post_max_size — the Auto Care admin uploads process videos.
    client_max_body_size 90m;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's DNS, asked on every request (cached 10 s) instead of once at
    # start: nginx starts even while backend is not resolvable yet, and keeps
    # working after backend is recreated with a new IP (make prod-up).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream backend:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The AI assistant waits on the model for up to ~2 minutes.
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
