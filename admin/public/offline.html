<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Phay · Կապ չկա</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #eaf6f3;
        background:
          radial-gradient(120% 90% at 100% 0%, rgba(95, 208, 176, 0.35) 0%, rgba(95, 208, 176, 0) 55%),
          linear-gradient(160deg, #0f4c5c 0%, #0b2e36 100%);
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 16px 36px -16px rgba(0, 0, 0, 0.6);
        animation: float 3.2s ease-in-out infinite;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(234, 246, 243, 0.75);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 600;
        color: #0b2e36;
        background: #ffffff;
        cursor: pointer;
      }
      @keyframes float {
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/phay-192.png" alt="Phay" />
      <h1>Ինտերնետ կապ չկա</h1>
      <p>Phay-ը կբացվի, հենց կապը վերականգնվի։ Ձեր տվյալները պահպանված են սերվերում։</p>
      <button type="button" onclick="location.reload()">Կրկին փորձել</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
