# Temporary HTTP-only server for the very first certificates on a new server
# (the real configs refer to certificates that do not exist yet, so nginx
# would refuse them). Answers Let's Encrypt challenges for every name.
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/acme.nginx.conf /etc/nginx/sites-available/acme
#   sudo ln -s /etc/nginx/sites-available/acme /etc/nginx/sites-enabled/acme
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d phay.am -d www.phay.am -d app.phay.am -d api.phay.am
#   sudo rm /etc/nginx/sites-enabled/acme      # then install the real configs
#
# Renewals keep working afterwards: the real configs serve the same
# /.well-known/acme-challenge/ path on port 80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
