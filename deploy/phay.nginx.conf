# HOST-level nginx for Phay. It runs on the server itself (not inside
# Docker) and proxies to the containers published on 127.0.0.1:
#   api.phay.am -> 127.0.0.1:8080 (API_PORT in .env.prod)
#   app.phay.am -> 127.0.0.1:3001 (ADMIN_PORT in .env.prod)
#   phay.am     -> redirect to app.phay.am (room for a future landing)
#
# Install (full steps in docs/DEPLOY.md):
#   sudo cp deploy/tls-params.conf /etc/nginx/snippets/tls-params.conf
#   sudo cp deploy/phay.nginx.conf /etc/nginx/sites-available/phay.am
#   sudo ln -s /etc/nginx/sites-available/phay.am /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# The certificate must exist first (one for all four names):
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d phay.am -d www.phay.am -d app.phay.am -d api.phay.am
#
# `listen ... ssl http2` works on nginx 1.18+ (Ubuntu 22.04/24.04 packages).
# Businesses' sites (servio.am and others) have their own server blocks in
# their own repositories; they reach the API at https://api.phay.am.

upstream phay_api {
    server 127.0.0.1:8080;
}

upstream phay_admin {
    server 127.0.0.1:3001;
}

# HTTP: certificate challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name phay.am www.phay.am app.phay.am api.phay.am;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# phay.am: no landing yet.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phay.am www.phay.am;

    ssl_certificate     /etc/letsencrypt/live/phay.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phay.am/privkey.pem;
    include snippets/tls-params.conf;

    return 302 https://app.phay.am$request_uri;
}

# API: the sites' public API (/api/v1/*), the admin API (/api/v1/admin/*,
# called server-side by the admin app) and uploaded files (/storage/*).
# CORS is answered by Laravel from each site's settings.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.phay.am;

    ssl_certificate     /etc/letsencrypt/live/phay.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phay.am/privkey.pem;
    include snippets/tls-params.conf;

    # Matches php.ini's post_max_size — admin uploads process videos.
    client_max_body_size 90m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://phay_api;
        # The AI assistant waits on the model for up to ~2 minutes.
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin app for every business and the platform team.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.phay.am;

    ssl_certificate     /etc/letsencrypt/live/phay.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phay.am/privkey.pem;
    include snippets/tls-params.conf;

    # Matches php.ini's post_max_size — admin uploads process videos.
    client_max_body_size 90m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://phay_admin;
        # The AI assistant page waits on the model for up to ~2 minutes.
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
