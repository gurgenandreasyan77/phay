# Example HOST-level Nginx config for servio.am — this runs on the server
# itself (NOT inside Docker) and reverse-proxies to the containers
# published on 127.0.0.1:${FRONTEND_PORT}, 127.0.0.1:${ADMIN_PORT} and
# 127.0.0.1:${API_PORT}. The admin panel is served on admin.servio.am.
#
# Install: copy to /etc/nginx/sites-available/servio.am, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx`. Replace
# "servio.am" and the upstream ports below with your real values.
#
# This file assumes it lives alongside other server blocks on a shared host,
# so it does not claim the default_server and uses explicit upstream ports
# instead of anything hardcoded to a single project.

upstream servio_frontend {
    server 127.0.0.1:3000;
}

upstream servio_api {
    server 127.0.0.1:8080;
}

upstream servio_admin {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name servio.am www.servio.am;

    # Required for Let's Encrypt's HTTP-01 challenge (certbot --webroot or
    # --nginx will manage this location automatically; keep it if you renew
    # manually). See "SSL via Let's Encrypt" in the README.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Canonical host is the apex (servio.am) — collapse both the scheme
    # (http→https) and the host (www→apex) in one redirect, rather than
    # bouncing http://www through https://www first. $request_uri already
    # includes the leading "/" plus any query string, so path/query survive.
    location / {
        return 301 https://servio.am$request_uri;
    }
}

# www over HTTPS must 301 to the apex too — without this block, both
# https://servio.am and https://www.servio.am serve identical content with
# no canonical host, which is exactly the duplicate-host issue the SEO audit
# flagged. Requires a certificate that covers both names (the certbot command
# below already requests both SANs on one cert, so no extra cert is needed).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.servio.am;

    ssl_certificate     /etc/letsencrypt/live/servio.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servio.am/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://servio.am$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name servio.am;

    # After running certbot (see README "SSL via Let's Encrypt"), it will
    # point these at the real certificate. Until then this server block will
    # fail to start — either comment it out or run certbot in --nginx mode,
    # which edits this section for you.
    ssl_certificate     /etc/letsencrypt/live/servio.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servio.am/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Same-origin API: the frontend calls /api/v1/... on its own domain, so
    # no browser-side CORS is involved in production. proxy_pass has no path
    # after the upstream name, so the original /api/... URI is forwarded
    # unchanged and lines up with Laravel's own /api/v1/* and /api/health routes.
    location /api/ {
        proxy_pass http://servio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://servio_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin panel (servio-admin). It only talks to the Laravel API server-side
# over the Docker network, so no /api/ location is needed here. The
# certificate is the same one as servio.am — request it with
# `-d admin.servio.am` added (see README "SSL via Let's Encrypt").
server {
    listen 80;
    listen [::]:80;
    server_name admin.servio.am;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.servio.am$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.servio.am;

    ssl_certificate     /etc/letsencrypt/live/servio.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servio.am/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Matches php.ini's post_max_size — admin uploads process videos.
    client_max_body_size 90m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://servio_admin;
        # The AI assistant page waits on the model for up to ~2 minutes.
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
