# Shared TLS settings for every HTTPS server block on this host (phay.am and
# servio.am alike). Install once: /etc/nginx/snippets/tls-params.conf.
# The same file ships in the phay and servio repositories; either copy works.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
