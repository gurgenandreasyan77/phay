name: ${COMPOSE_PROJECT_NAME:-servio}

networks:
  servio:

volumes:
  postgres_data:
  frontend_node_modules:
  admin_node_modules:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servio}
      POSTGRES_USER: ${POSTGRES_USER:-servio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servio} -d ${POSTGRES_DB:-servio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - servio

  backend:
    build:
      context: ./servio-back
      target: dev
      additional_contexts:
        configs: ./servio-docker
    restart: unless-stopped
    volumes:
      - ./servio-back:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Servio}
      APP_ENV: ${APP_ENV:-local}
      # APP_KEY intentionally not overridden here — it comes from the
      # bind-mounted backend/.env so an empty root .env value can't blank it out.
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-servio}
      DB_USERNAME: ${POSTGRES_USER:-servio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      # Copied once into the default business's site by the migration that
      # gave every site its own cache-refresh webhook (Platform → Sites).
      SITE_REVALIDATE_URL: http://frontend:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev_revalidate_secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LEADS_RATE_LIMIT_PER_MINUTE: ${LEADS_RATE_LIMIT_PER_MINUTE:-5}
      ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      # Invitation / password reset links point here.
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - servio

  api:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./servio-back:/var/www/html:ro
      - ./servio-docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - servio

  frontend:
    build:
      context: ./servio-front
      target: dev
    # node_modules lives in a named volume (so the host's own node_modules,
    # possibly built for another OS, is never used). Docker normally fills a
    # new volume from the image, but if it ever comes up empty or without
    # devDependencies, install them up front — otherwise `next dev` crashes
    # ("next: not found") or installs TypeScript itself mid-run, which can
    # kill Turbopack's CSS worker (SIGBUS).
    command: sh -c "[ -x node_modules/.bin/next ] && [ -d node_modules/typescript ] || npm ci --include=dev --no-audit --no-fund; exec npm run dev -- --hostname 0.0.0.0"
    restart: unless-stopped
    volumes:
      - ./servio-front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Pinned so a stray NODE_ENV (e.g. "production") can't make npm skip
      # devDependencies or put `next dev` in a non-standard mode.
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SITE_KEY: ${NEXT_PUBLIC_SITE_KEY:-}
      NEXT_INTERNAL_API_URL: http://api/api/v1
      # The admin app lives on its own port; /admin/* on the site redirects there.
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      # Checked on /api/revalidate; the platform sends it (set on the site in Platform → Sites).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev_revalidate_secret}
      NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-+374 55 337633}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-info@servio.am}
      NEXT_PUBLIC_CONTACT_CITY: ${NEXT_PUBLIC_CONTACT_CITY:-Yerevan, Armenia}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
      NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
      NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL:-}
      NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
      NEXT_PUBLIC_VIBER_URL: ${NEXT_PUBLIC_VIBER_URL:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_GSC_VERIFICATION: ${NEXT_PUBLIC_GSC_VERIFICATION:-}
      NEXT_PUBLIC_BING_VERIFICATION: ${NEXT_PUBLIC_BING_VERIFICATION:-}
      NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:-Servio}
      NEXT_PUBLIC_BUSINESS_STREET: ${NEXT_PUBLIC_BUSINESS_STREET:-}
      NEXT_PUBLIC_BUSINESS_LOCALITY: ${NEXT_PUBLIC_BUSINESS_LOCALITY:-Yerevan}
      NEXT_PUBLIC_BUSINESS_COUNTRY: ${NEXT_PUBLIC_BUSINESS_COUNTRY:-AM}
      NEXT_PUBLIC_BUSINESS_LAT: ${NEXT_PUBLIC_BUSINESS_LAT:-}
      NEXT_PUBLIC_BUSINESS_LNG: ${NEXT_PUBLIC_BUSINESS_LNG:-}
      NEXT_PUBLIC_HOURS_OPENS: ${NEXT_PUBLIC_HOURS_OPENS:-09:00}
      NEXT_PUBLIC_HOURS_CLOSES: ${NEXT_PUBLIC_HOURS_CLOSES:-20:00}
      NEXT_PUBLIC_GOOGLE_MAPS_URL: ${NEXT_PUBLIC_GOOGLE_MAPS_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - servio

  admin:
    build:
      context: ./servio-admin
      target: dev
    # Same node_modules safeguard as the frontend service above.
    command: sh -c "[ -x node_modules/.bin/next ] && [ -d node_modules/typescript ] || npm ci --include=dev --no-audit --no-fund; exec npm run dev -- --hostname 0.0.0.0"
    restart: unless-stopped
    volumes:
      - ./servio-admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_INTERNAL_API_URL: http://api/api/v1
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      - api
    networks:
      - servio
