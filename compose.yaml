name: ${COMPOSE_PROJECT_NAME:-phay}

# Phay LOCAL stack (make local-*): the API (php-fpm + nginx), the admin app and Postgres.
# Sites of the businesses (servio.am and others) are separate projects that
# call this API with their X-Site-Key; nothing of them runs here.

networks:
  phay:

volumes:
  postgres_data:
  admin_node_modules:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phay}
      POSTGRES_USER: ${POSTGRES_USER:-phay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phay} -d ${POSTGRES_DB:-phay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phay

  backend:
    build:
      context: ./api
      target: dev
      additional_contexts:
        configs: ./docker
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
    # Sites run as their own projects on the host (e.g. servio on :3000);
    # their cache-refresh webhook is reached through the host. Docker Desktop
    # (Mac) has this name already; Linux needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Laravel reads the rest (APP_KEY, mail, AI, Google...) from the
    # bind-mounted api/.env. Only what follows from this stack's ports and
    # database is set here, so it always matches the root .env.
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8080}
      ADMIN_URL: http://localhost:${ADMIN_PORT:-3001}
      # The admin app and the local Servio site; every connected site's own
      # origins are added from Platform → Sites.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:${ADMIN_PORT:-3001}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-phay}
      DB_USERNAME: ${POSTGRES_USER:-phay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phay

  api:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phay

  admin:
    build:
      context: ./admin
      target: dev
    # node_modules lives in a named volume (so the host's own node_modules,
    # possibly built for another OS, is never used). If it ever comes up
    # empty or without devDependencies, install them up front — otherwise
    # `next dev` crashes ("next: not found") or installs TypeScript itself
    # mid-run, which can kill Turbopack's CSS worker (SIGBUS).
    command: sh -c "[ -x node_modules/.bin/next ] && [ -d node_modules/typescript ] || npm ci --include=dev --no-audit --no-fund; exec npm run dev -- --hostname 0.0.0.0"
    restart: unless-stopped
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_INTERNAL_API_URL: http://api/api/v1
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      - api
    networks:
      - phay
